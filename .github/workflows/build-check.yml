name: Build check

# Compiles the WinUI app (including XAML) and runs the unit tests for every pull request,
# so UI changes are verified on Windows before they reach the release workflow on main.
on:
  pull_request:
    paths:
      - "src/**"
      - "branding/**"
      - "MoE.slnx"
      - ".github/workflows/build-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore MoE.slnx

      - name: Build
        shell: pwsh
        run: dotnet build MoE.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test src\MoE.ModelManager.Tests\MoE.ModelManager.Tests.csproj -c Release --no-build
